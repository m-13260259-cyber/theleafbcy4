<style>
:root{--bg:#fff6f5;--c:#fff;--t:#222;--m:#666;--p:#d63b3b;--b:#ffd166;--no:#d62828;--l:#f4d6d2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#2a1414;--c:#3a1d1d;--t:#fdeceb;--m:#d9b3b0;--l:#6a3434}}
:root[data-theme=dark]{--bg:#2a1414;--c:#3a1d1d;--t:#fdeceb;--m:#d9b3b0;--l:#6a3434}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.7 "PingFang SC","Microsoft YaHei",sans-serif}
header{padding:14px;text-align:center}h1{margin:0;font-size:21px}header p{margin:2px 0 0;color:var(--m);font-size:14px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--l)}
nav button{flex:none;min-width:40px;border:2px solid var(--l);background:var(--c);color:var(--t);border-radius:20px;padding:5px 11px;font:inherit;font-size:14px}
nav button.on{background:var(--p);border-color:var(--p);color:#fff}
main{max-width:800px;margin:0 auto;padding:10px}
.card{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:14px;margin:10px 0}
h2{margin:0 0 6px;font-size:19px;color:var(--p)}ul{margin:4px 0;padding-left:20px}
.q{border-top:1px dashed var(--l);padding:10px 0}.q label{display:block;padding:6px 10px;margin:4px 0;border:2px solid var(--l);border-radius:10px}
.fb{font-size:14px;color:var(--m)}.fb.ok{color:var(--p)}.fb.no{color:var(--no)}
.sub{background:var(--p);color:#fff;border:0;border-radius:12px;padding:10px 26px;font:inherit;font-weight:700;margin-top:8px}.sub:disabled{opacity:.5}
.sc{font-size:20px;font-weight:700;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px}
